name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'bot/state.json'
      - '.github/workflows/bot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public site artifact
        run: |
          rm -rf _site
          cp -a . _site
          rm -rf _site/.git _site/.github _site/bot _site/docs _site/src
          ls _site/ | head -30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
