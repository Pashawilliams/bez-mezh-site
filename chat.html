<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120b3a">
<meta name="color-scheme" content="dark">
<title>Онлайн-чат — Eurotour</title>
<link rel="icon" href="images/cropped-apple-touch-icon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/cropped-apple-touch-icon-180x180.png">
<link rel="preload" href="fonts/FixelDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/FixelDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/chat.css">
<script>window.__SITE_BRIDGE={inbox:"et-inbox-zL0NL7gvzQJtWq3ZwnWNqAkiYp9fKrOYYx1d"};</script>
</head>
<body>
<div class="ch" id="app">
  <header class="ch__head">
    <a class="ch__back" id="back" href="index.html" aria-label="Назад на сайт">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="ch__who">
      <div class="ch__ava" id="ava"><img src="images/cropped-apple-touch-icon-192x192.png" alt=""><i class="ch__dot" id="dot"></i></div>
      <div class="ch__titles">
        <div class="ch__title" id="title">Eurotour · онлайн-чат</div>
        <div class="ch__status" id="status"><span>Менеджер на звʼязку</span></div>
      </div>
    </div>
    <button type="button" class="ch__menu-btn" id="menuBtn" aria-label="Меню чату" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <button type="button" class="ch__close" id="closeBtn">Закрити чат</button>
    <div class="ch__menu" id="menu" hidden>
      <button type="button" data-act="tg"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6 18.9 19c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.9.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L7.5 13.1 3 11.7c-1-.3-1-1 .2-1.4l17.4-6.7c.8-.3 1.5.2 1.3 1z"/></svg>Написати в Telegram</button>
      <button type="button" data-act="name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Змінити імʼя</button>
      <button type="button" data-act="end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9h6v6H9z"/></svg>Завершити діалог</button>
      <button type="button" data-act="clear" class="is-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Очистити історію</button>
    </div>
  </header>

  <div class="ch__offline" id="offline" hidden>Немає звʼязку з інтернетом — повідомлення надішлються, коли зʼявиться мережа</div>

  <main class="ch__body" id="body" aria-live="polite">
    <div class="ch__list" id="list"></div>
  </main>

  <button type="button" class="ch__jump" id="jump" hidden aria-label="До нових повідомлень">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span id="jumpN" hidden></span>
  </button>

  <div class="ch__quick" id="quick">
    <button type="button" data-q="Хочу забронювати місце. Підкажіть вільні дати?">🎫 Забронювати</button>
    <button type="button" data-q="Скільки коштує проїзд і що входить у ціну?">💰 Ціна</button>
    <button type="button" data-q="Чи можна доставити посилку?">📦 Посилка</button>
    <button type="button" data-q="Потрібен трансфер з аеропорту">🚐 Трансфер</button>
  </div>

  <footer class="ch__composer">
    <div class="ch__name-row" id="nameRow">
      <label for="name">Як до вас звертатись?</label>
      <input id="name" type="text" maxlength="40" autocomplete="name" placeholder="Ваше імʼя (необовʼязково)">
    </div>
    <div class="ch__attach-strip" id="strip" hidden></div>
    <form class="ch__form" id="form" novalidate>
      <input type="file" id="file" hidden multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.7z,.heic,.mp4,.mov">
      <button type="button" class="ch__ibtn" id="attach" aria-label="Прикріпити фото або файл">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="inp" class="ch__inp" rows="1" placeholder="Напишіть повідомлення…" maxlength="2000" enterkeyhint="send"></textarea>
      <button type="submit" class="ch__send" id="send" aria-label="Надіслати" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
      </button>
    </form>
    <div class="ch__hint">Відповідь зʼявиться тут · Ми онлайн щодня, цілодобово</div>
  </footer>
</div>

<div class="ch__lightbox" id="lightbox" hidden>
  <button type="button" class="ch__lb-x" id="lbClose" aria-label="Закрити">✕</button>
  <img id="lbImg" alt="">
  <a id="lbDl" class="ch__lb-dl" href="#" download target="_blank" rel="noopener">Завантажити</a>
</div>

<div class="ch__toast" id="toast" hidden></div>

<script src="js/chat-app.js" defer></script>
</body>
</html>
